# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/twig-components/resources/config/twig-components-services.yaml' }
#
# The components are tagged with `derafu_twig.component`: whoever creates the
# Twig environment (see derafu/twig) takes them with
# `!tagged_iterator derafu_twig.component`. The tag is explicit because
# _instanceof does not propagate across imported files.

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\TwigComponents\Translation\TwigTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']

    # The components, tagged for the Twig environment that registers them.
    Derafu\TwigComponents\Component\:
        resource: '../../src/Component/*'
        tags: ['derafu_twig.component']
